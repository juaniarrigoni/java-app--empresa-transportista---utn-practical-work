server:
  port: 8080
spring:
  application.name: api-gateway
  cloud:
    gateway:
      default-filters: [ AddResponseHeader=X-Gateway, tpi ]
      routes:
        - id: catalogos
          uri: http://localhost:8081
          predicates: [ Path=/api/catalogos/** ]
        - id: solicitudes
          uri: http://localhost:8082
          predicates: [ Path=/api/solicitudes/** ]
        - id: operaciones
          uri: http://localhost:8083
          predicates: [ Path=/api/operaciones/** ]
springdoc.swagger-ui.path: /swagger
